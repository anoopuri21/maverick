name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: |
          set +e
          php artisan test 2>&1 | tee /tmp/php-artisan-test.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            # The job log is not always available to API clients. Keep a short
            # diagnostic in the check annotation as well, without
            # changing the test command's exit status.
            summary=$(tail -n 40 /tmp/php-artisan-test.log | tr '\n' ' ' | cut -c1-3500 | sed 's/%/%25/g;s/\r/%0D/g')
            echo "::error title=PHP test suite failed::$summary"
          fi

          exit "$status"

  javascript:
    name: JavaScript regression tests and Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm test
