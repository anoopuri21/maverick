; Shared hosting PHP limits (cPanel / LiteSpeed pick this up from public/)
; Align with Filament/Livewire image caps (5MB) + small headroom for multipart overhead.

upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; Prefer daily-ish log rotation via Laravel; keep PHP errors out of public if possible
display_errors = Off
log_errors = On

; OPCache — only applied when the host allows these directives (many shared hosts do)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
